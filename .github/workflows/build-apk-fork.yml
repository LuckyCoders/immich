name: Build APK (fork debug)

on:
  workflow_dispatch:
  push:
    branches: [fix/null-bucket-date-apk]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk-fork.yml'
      - 'i18n/**'

concurrency:
  group: build-apk-fork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Flutter deps
        working-directory: mobile
        run: flutter pub get

      - name: Generate translations
        working-directory: mobile
        run: |
          dart run easy_localization:generate -S ../i18n
          dart run bin/generate_keys.dart
          dart format lib/generated/ || true

      - name: Generate pigeon APIs
        working-directory: mobile
        run: |
          for f in pigeon/*.dart; do
            dart run pigeon --input "$f"
          done
          dart format lib/platform/ || true

      - name: Generate Drift / build_runner
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: immich-null-bucket-fix-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
